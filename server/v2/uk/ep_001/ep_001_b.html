<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Варіант B — Мінімалізм · Ранок без сестри</title>
<style>
:root {
  --bg: #0d0d12;
  --text: #e8e6e3;
  --muted: #8a8a8a;
  --accent: #c7b8e8;
  --border: #2a2a35;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Georgia', serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text); font-family: var(--font-ui);
}
body { display: flex; flex-direction: column; }

/* ── Fixed top-bar buttons (same glass style as variant A) ── */
.v2-back {
  position: fixed; top: 10px; left: 12px; z-index: 221;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
  color: rgba(255,255,255,0.85); border: 1px solid rgba(255,255,255,0.2);
  border-radius: 8px; padding: 6px 10px;
  font-family: var(--font-ui); font-size: 13px; font-weight: 600;
  text-decoration: none; line-height: 1;
}
.v2-back:hover { background: rgba(0,0,0,0.85); color: #fff; }

.v2-controls {
  position: fixed; top: 10px; right: 12px; z-index: 221;
  display: flex; gap: 6px; align-items: center;
}
.v2-btn {
  background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
  color: #fff; border: 1px solid rgba(255,255,255,0.22);
  border-radius: 8px; padding: 6px 10px;
  font-family: var(--font-ui); font-size: 13px; font-weight: 600;
  cursor: pointer; min-width: 34px; text-align: center; line-height: 1;
}
.v2-btn:hover { background: rgba(0,0,0,0.85); }
.v2-btn.active { background: rgba(199,184,232,0.85); color: #0d0d12; border-color: transparent; }

/* ── Player — fills remaining space ── */
.player {
  position: relative;
  flex: 1;
  overflow: hidden; cursor: pointer; user-select: none;
  background: #1e1810;
}
.player-bg {
  position: absolute; inset: 0;
  background-image: url('https://pub-77b6fd849494491a8cd26f9e0df3db3f.r2.dev/ep_001/images/ep001_s01.png');
  background-size: cover; background-position: center top;
}
.player-vignette {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom,
    rgba(0,0,0,0.08) 0%,
    rgba(0,0,0,0.0) 30%,
    rgba(0,0,0,0.82) 100%);
}

/* Title pill — moved down to avoid overlap with fixed controls */
.player-title {
  position: absolute; top: 50px; left: 12px;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
  color: #fff; font-size: 0.78rem; font-weight: 500;
  padding: 5px 12px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  white-space: nowrap;
}

/* Scene dots — moved down to avoid overlap with fixed controls */
.player-dots {
  position: absolute; top: 50px; right: 12px;
  display: flex; gap: 4px; align-items: center;
}
.pdot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
  flex-shrink: 0;
}
.pdot.current { background: var(--accent); width: 18px; height: 6px; border-radius: 3px; }
.pdot.done { background: rgba(199,184,232,0.45); width: 4px; height: 4px; }

/* Bottom text card */
.player-card {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(10,10,16,0.88); backdrop-filter: blur(6px);
  padding: 0.85rem 1.1rem 0.65rem;
}
.player-sentence {
  font-family: var(--font-serif);
  font-size: 1rem; line-height: 1.65; color: var(--text);
  min-height: 1.65rem;
  transition: opacity 0.2s ease;
}
.player-sentence.fade { opacity: 0; }
.player-progress {
  margin-top: 0.55rem;
  height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;
}
.player-progress-fill {
  height: 100%; background: var(--accent); border-radius: 2px;
  transition: width 0.4s ease;
}

/* Tap hint */
.tap-hint {
  flex-shrink: 0;
  padding: 0.55rem 1rem;
  background: rgba(13,13,18,0.95); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
}
.tap-hint-label {
  font-size: 0.66rem; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--muted); flex: 1; text-align: center;
}
.tap-hint-back {
  background: rgba(255,255,255,0.07); border: 1px solid var(--border);
  color: var(--muted); border-radius: 6px;
  font-family: var(--font-ui); font-size: 0.8rem;
  padding: 0.3rem 0.8rem; cursor: pointer; white-space: nowrap;
}
.tap-hint-back:hover { background: rgba(255,255,255,0.12); color: var(--text); }
.tap-hint-btn {
  background: var(--accent); color: #0d0d12;
  font-family: var(--font-ui); font-size: 0.8rem; font-weight: 700;
  padding: 0.3rem 0.9rem; border-radius: 6px; border: none; cursor: pointer;
  white-space: nowrap;
}

/* Variant badge */
.v-badge {
  position: fixed; bottom: 12px; right: 12px; z-index: 200;
  background: rgba(0,0,0,0.8); color: var(--accent);
  font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700;
  padding: 5px 8px; border-radius: 6px; border: 1px solid rgba(199,184,232,0.35);
}
</style>
</head>
<body>

<div class="v-badge">ВАРІАНТ B</div>

<!-- Fixed: back button top-left -->
<a class="v2-back" href="../index.html">← Курс</a>

<!-- Fixed: controls top-right -->
<div class="v2-controls">
  <button class="v2-btn" id="speed-btn" onclick="cycleSpeed()">1×</button>
  <button class="v2-btn" id="play-btn" onclick="togglePlay()">▶</button>
  <button class="v2-btn">🔇</button>
  <button class="v2-btn">🌐 RU</button>
</div>

<!-- Player -->
<div class="player" id="player" onclick="nextSentence()">
  <div class="player-bg"></div>
  <div class="player-vignette"></div>

  <div class="player-title">Ранок без сестри</div>

  <div class="player-dots">
    <span class="pdot current"></span>
    <span class="pdot"></span><span class="pdot"></span><span class="pdot"></span>
    <span class="pdot"></span><span class="pdot"></span><span class="pdot"></span>
    <span class="pdot"></span><span class="pdot"></span><span class="pdot"></span>
    <span class="pdot"></span><span class="pdot"></span><span class="pdot"></span>
    <span class="pdot"></span><span class="pdot"></span><span class="pdot"></span>
    <span class="pdot"></span><span class="pdot"></span>
  </div>

  <div class="player-card">
    <div class="player-sentence" id="sentence">Марко розплющує очі. Стеля біла. Звичайна.</div>
    <div class="player-progress">
      <div class="player-progress-fill" id="pbar" style="width:5.5%"></div>
    </div>
  </div>
</div>

<!-- Tap hint -->
<div class="tap-hint">
  <button class="tap-hint-back" onclick="prevSentence()">← Назад</button>
  <span class="tap-hint-label">ТОРКНИСЬ, ЩОБ ПРОДОВЖИТИ</span>
  <button class="tap-hint-btn" onclick="nextSentence()">Далі →</button>
</div>

<script>
var sentences = [
  "Марко розплющує очі. Стеля біла. Звичайна.",
  "Ліжко навпроти — порожнє. Ковдра застелена. Не просто застелена — натягнута, як у готелі.",
  "Марко сідає. Мружиться. На стіні — чотири рамки. Зараз рамки порожні. Білий картон замість облич."
];
var pcts = ["5.5%", "33%", "66%"];
var cur = 0;

function showSentence(idx) {
  var el = document.getElementById("sentence");
  el.classList.add("fade");
  setTimeout(function() {
    cur = (idx + sentences.length) % sentences.length;
    el.textContent = sentences[cur];
    document.getElementById("pbar").style.width = pcts[cur];
    el.classList.remove("fade");
  }, 200);
}
function nextSentence() { showSentence(cur + 1); }
function prevSentence() { showSentence(cur - 1); }

var speeds = ["1×", "1.5×", "2×"];
var speedIdx = 0;
function cycleSpeed() {
  speedIdx = (speedIdx + 1) % speeds.length;
  document.getElementById("speed-btn").textContent = speeds[speedIdx];
}

var playing = false;
function togglePlay() {
  playing = !playing;
  var btn = document.getElementById("play-btn");
  btn.textContent = playing ? "⏸" : "▶";
  btn.classList.toggle("active", playing);
}
</script>
</body>
</html>
